[board]
name = "fairlady"
soc = "SM8850"
description = "OnePlus 15T (fairlady) PLZ110: UniXNU bring-up"
kit = "fairlady"

[kernel]
defconfig = "fairlady_defconfig"
source_only = true
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  "build-arm-platform.py",
]

[payload]
volume = "UNIXNU15T"
size_mib = 64
loader = "firmware"
title = "OnePlus 15T (fairlady) UniXNU"
dram_size = "0x10000000"
timeout = 10
kernel_args = ["-v", "serial=0", "debug=0x14e", "cpus=1", "-enable_kprintf_spam", "kt_fixed_zones=240"]

[payload.adt]
tool = "scripts/make-fairlady-adt.py"
owned_memory_size = "0x10000000"
cpu_regs = "0"

[bootimg]
embed_payload = true

[firmware]
config = "fairlady"
dsc = "Platforms/OnePlus/fairladyPkg/fairlady.dsc"
fd = "Build/fairladyPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = [
  "Binaries",
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
]

[firmware.defines]
DEVICE_MODEL = "fairlady"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "fairlady-unixnu-20261022"
